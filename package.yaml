# Normally, increase the version using the script `stack exec koka -- -e util/reversion -- -v<version>`
# (where the <version> is without a preceding 'v'). This will update the version in all required places.
#
# When increasing the version manually, increase the version below at the cpp-options as well,
# and also update other files that contain a version:
# - util/install.sh
# - util/install.bat
# - util/minbuild
# - support/vscode/koka.language-koka/whatsnew.md
# - readme.md


name:       koka
version:    3.2.7
github:     "koka-lang/koka"
license:    Apache-2.0
author:     Daan Leijen
maintainer: daan@microsoft.com

extra-source-files:
  - readme.md

description: Please see the README on GitHub at <https://github.com/koka-lang/koka#readme>

dependencies:
  - base >= 4.9
  - array
  - bytestring
  - containers
  - mtl
  - parsec
  - text
  - time
  - async
  - FloatingHex >= 0.5
  - hashable >= 1.4
  - directory
  - process

library:
  other-extensions:
    - CPP
    - OverloadedStrings
  source-dirs:
    - src
  build-tools:
    - alex
  ghc-options:
    - -j8
    - -O2
    - -Wno-x-partial   # todo: compile with this enabled..

  cpp-options:
    - -DKOKA_MAIN="koka"
    - -DKOKA_VARIANT="release"
    - -DKOKA_VERSION="3.2.7"
    - -DREADLINE=0   # 1:getline, 2:readline, 3:haskeline, or 0:isocline
  when:
    - condition: os(windows)
      cpp-options: -DWINDOWS
    - condition: os(darwin)
      cpp-options: -DDARWIN
    # ── Platform: GHC WASM backend ──
    - condition: arch(wasm32)
      source-dirs: src/Platform/wasm
      cpp-options: -DKOKA_WASM
      exposed-modules:
        - Platform.Config
        - Platform.Console
        - Platform.FileIO
        - Platform.Filetime
        - Platform.GetOptions
        - Platform.ReadLine
        - Platform.Runtime
        - Platform.Var
    # ── Platform: Native (default) ──
    - condition: "!arch(wasm32)"
      source-dirs: src/Platform/cpp
      c-sources:
        - src/Platform/cpp/Platform/cconsole.c
        - src/Platform/cpp/Platform/cconsole.h
      include-dirs:
        - src/Platform/cpp/Platform
      dependencies:
        - isocline >= 1.0.6
      exposed-modules:
        - Platform.Config
        - Platform.Console
        - Platform.FileIO
        - Platform.Filetime
        - Platform.GetOptions
        - Platform.ReadLine
        - Platform.Runtime
        - Platform.Var

executables:
  koka:
    main: Main.hs
    source-dirs: src/Main/langserver
    dependencies:
      - aeson
      - async
      - co-log-core
      - koka
      - lens
      - lsp
      - network-simple
      - network
      - text-rope
      - stm
    ghc-options:
      - -rtsopts
      - -j8
      - -O2
      - -threaded
      # - -fprof-auto
      # - -finfo-table-map
      # - -fdistinct-constructor-tables
      # - '"-with-rtsopts=-N8 -l"'
      - '"-with-rtsopts=-N8"'
    when:
      - condition: "arch(wasm32)"
        buildable: false

  koka-plain:
    main: Main.hs
    source-dirs: src/Main/plain
    dependencies: koka
    ghc-options:
      - -rtsopts
      - -j8
      - -O2
      - -threaded
      # - -fprof-auto
      # - -finfo-table-map
      # - -fdistinct-constructor-tables
      # - '"-with-rtsopts=-N8 -l"'
      - '"-with-rtsopts=-N8"'
    when:
      - condition: "arch(wasm32)"
        buildable: false

  koka-playground:
    main: Main.hs
    source-dirs: src/Main/playground
    dependencies:
      - koka
    ghc-options:
      - -O2
    when:
      - condition: "!arch(wasm32)"
        buildable: false
      - condition: arch(wasm32)
        cpp-options: -DKOKA_WASM

  koka-lsp-wasm:
    main: Main.hs
    source-dirs:
      - src/Main/langserver
    dependencies:
      - aeson
      - async
      - co-log-core
      - koka
      - lens
      - lsp
      - text-rope
      - stm
    cpp-options: -DKOKA_WASM
    ghc-options:
      - -O2
    when:
      - condition: "!arch(wasm32)"
        buildable: false

tests:
  koka-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - koka
      - extra
      - filepath
      - hspec
      - hspec-core
      - process
      - regex-compat >= 0.95.2.1
      - json
    when:
      - condition: "arch(wasm32)"
        buildable: false


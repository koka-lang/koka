on:
  workflow_dispatch:   # so we can run the workflow manually as well
  push:
    branches:
      - dev
    tags:
      - 'v*'
  pull_request:
    branches:
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true # Cancel any in-progress runs of this workflow when a new run is triggered on the same ref (branch or tag)

permissions:
  contents: read

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

name: Test
jobs:
  build:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macOS 15 is latest for x64, default now is arm64
        # we build on the oldest ubuntu version for better binary compatibility.
        # arm64 macOS stays on macos-15 until https://github.com/actions/runner-images/issues/14940
        # is fixed: macos-26 (macOS-latest) pairs Xcode 26's linker with the macOS 27 SDK, which GHC links against.
        os: [windows-latest, macos-15, macos-15-intel, ubuntu-22.04, ubuntu-22.04-arm]
        # split the test suite over multiple jobs (see `--shard` in test/readme.md)
        shard: [0, 1, 2, 3]
        target: [c, js]
        # test the js backend only on ubuntu-22.04
        exclude:
          - { target: js, os: windows-latest }
          - { target: js, os: macos-15 }
          - { target: js, os: macos-15-intel }
          - { target: js, os: ubuntu-22.04-arm }

    steps:
      # Checkout: https://github.com/actions/checkout
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      # Cache setup for vcpkg (https://learn.microsoft.com/en-us/vcpkg/consume/binary-caching-github-actions-cache)
      # https://github.com/actions/github-script
      - name: Setup vcpkg cache
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # Use a VS shell on Windows (so `cl` is on the PATH): https://github.com/egor-tensin/vs-shell (MIT license)
      - name: Set up Visual Studio shell (Windows x64)
        uses: egor-tensin/vs-shell@3b829f5acc8082151a836f5a3a179f69336ae1f2 # v2.3.0
        if: runner.os == 'Windows' && runner.arch == 'X64'
        with:
          arch: x64

      # Use the clang-cl bundled with Visual Studio as its STL may require a newer clang than the one in C:\Program Files\LLVM
      - name: Use Visual Studio clang-cl (Windows x64)
        if: runner.os == 'Windows' && runner.arch == 'X64'
        run: |
          $llvm = Join-Path $env:VCINSTALLDIR "Tools\Llvm\x64\bin"
          & "$llvm\clang-cl.exe" --version
          echo $llvm >> $env:GITHUB_PATH

      # Set VCPKG_ROOT on Windows (otherwise it points to the wrong one in the VS install)
      - name: Set VCPKG_ROOT (Windows)
        if: runner.os == 'Windows'
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      # Set up stack and cache dependencies: https://github.com/freckle/stack-action (MIT license)
      - name: Build compiler
        uses: freckle/stack-action@2ca244dc7a7a078954198c858e6090ae0f0f8abe # v5.7.33
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          test: false
          stack-build-arguments: "--fast"
          cache-save-always: true

      # https://github.com/actions/setup-node
      - name: Set up Node.js
        if: matrix.target == 'js'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Run tests
      - name: Run test suite
        if: runner.os != 'macOS' && matrix.shard != 0
        run: |
          stack exec koka -- --version
          stack test --fast --test-arguments="--shard=${{ matrix.shard }}/3 --target-${{ matrix.target }}"

      - name: Run test suite (macOS)
        if: runner.os == 'macOS' && matrix.shard != 0
        env:
          LC_ALL: C
        run: |
          stack exec koka -- --version
          stack test --fast --test-arguments="--shard=${{ matrix.shard }}/3 --target-${{ matrix.target }}"

      # Bundle (only once per OS)
      - name: Build libraries
        if: matrix.shard == 0 && matrix.target == 'c'
        run: |
          stack exec koka -- -e -O2 util/bundle

      # Build all standard libraries for other backends
      - name: Build libraries (${{ matrix.target }})
        if: matrix.shard == 0 && matrix.target != 'c'
        run: |
          stack exec koka -- --target=${{ matrix.target }} -O2 util/link-std

      # VS Code extension tests (support/vscode/koka.language-koka/src/test) on the compiler just built
      - name: Test VS Code extension
        if: matrix.shard == 0 && matrix.target == 'c' && matrix.os == 'ubuntu-22.04'
        working-directory: support/vscode/koka.language-koka
        shell: bash
        run: |
          npm install --no-audit --no-fund
          export KOKA_COMPILER="$(stack path --local-install-root)/bin/koka"
          xvfb-run -a npm test

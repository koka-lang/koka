name: Build Koka Playground

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: playground-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GHC_WASM_META_FLAVOUR: '9.12'
  GHC_WASM_META_COMMIT: '8079eb96bbc63823d99ad8acaff0765532625474'  # pinned commit of https://gitlab.haskell.org/haskell-wasm/ghc-wasm-meta

jobs:
  build:
    name: Build Playground
    # GHC 9.10.3 cannot link on ubuntu-26.04 ("collect2: fatal error: cannot find 'ld'")
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      # Checkout: https://github.com/actions/checkout
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      # ── Setup toolchains ──────────────────────────────────────────────

      - name: Setup GHC + Cabal + Stack
        uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: '9.12'
          cabal-version: '3.16'
          enable-stack: true
          stack-version: 'latest'

      # GHC WASM backend
      - name: Cache GHC WASM toolchain
        id: cache-ghc-wasm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ghc-wasm
          key: ghc-wasm-${{ env.GHC_WASM_META_FLAVOUR }}-${{ env.GHC_WASM_META_COMMIT }}

      - name: Install GHC WASM backend
        if: steps.cache-ghc-wasm.outputs.cache-hit != 'true'
        run: |
          cd "$(mktemp -d)"
          curl -fL --retry 5 "https://gitlab.haskell.org/haskell-wasm/ghc-wasm-meta/-/archive/$GHC_WASM_META_COMMIT/ghc-wasm-meta-$GHC_WASM_META_COMMIT.tar.gz" | tar xz --strip-components=1
          FLAVOUR="$GHC_WASM_META_FLAVOUR" ./setup.sh

      - name: Verify GHC WASM
        run: |
          source ~/.ghc-wasm/env
          wasm32-wasi-ghc --version

      # Tools
      - name: Cache hpack + alex
        id: cache-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cabal/bin
          key: cabal-tools-${{ runner.os }}-ghc9.12-v3

      - name: Install hpack + alex
        run: |
          mkdir -p "$HOME/.cabal/bin"
          echo "$HOME/.cabal/bin" >> $GITHUB_PATH
          export PATH="$HOME/.cabal/bin:$PATH"
          if ! which hpack &>/dev/null || ! which alex &>/dev/null; then
            cabal update
            cabal install hpack alex --overwrite-policy=always --installdir="$HOME/.cabal/bin"
          fi
          hpack --version && alex --version

      # ── Caches ─────────────────────────────────────────────────────────

      - name: Cache cabal packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: cabal-wasm-${{ env.GHC_WASM_META_FLAVOUR }}-${{ hashFiles('package.yaml', 'cabal.project') }}
          restore-keys: cabal-wasm-${{ env.GHC_WASM_META_FLAVOUR }}-

      - name: Cache stack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.stack
            .stack-work
          key: stack-${{ hashFiles('package.yaml', 'stack.yaml', 'stack.yaml.lock') }}
          restore-keys: stack-

      # ── Build everything via playground.kk ────────────────────────────

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Install web dependencies
        run: cd web/playground && npm install

      - name: Build all (WASM, LSP, precompile, deploy)
        run: |
          unset GHC_PACKAGE_PATH
          stack run koka -- -e util/playground.kk -- --backend=all

      # `vite build` peaks at ~3.4GB of JS heap with sourcemaps (~1.9GB without), above
      # Node 20's ~2GB default limit (measured with `node --trace-gc`, 2026-11-14).
      - name: Build web frontend
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: cd web/playground && npm run build

      - name: Run tests
        run: node web/playground/test/test-wasm.mjs
